server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Send access/error logs to stdout/stderr (not the default log files) so
    # Railway's log viewer actually shows request-level activity — the prior
    # silence after "nginx -t" made it impossible to tell whether nginx was
    # serving requests or stuck, since its default file logs aren't visible.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # MCP Streamable-HTTP — direct path for claude.ai integrations.
    # proxy_buffering off is essential: MCP uses SSE and nginx would otherwise
    # buffer events until the connection closes, breaking the protocol.
    location /mcp/ {
        proxy_pass         http://127.0.0.1:8001/mcp/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        '';
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    }

    # Proxy Python MCP API server (agentic-tools/api_server.py on port 8001)
    location /api/mcp/ {
        proxy_pass         http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        '';
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    }

    # Proxy SEC EDGAR data API (mirrors Vite dev proxy)
    location /api/edgar/ {
        proxy_pass         https://data.sec.gov/;
        proxy_ssl_server_name on;
        proxy_set_header   Host   data.sec.gov;
        proxy_set_header   User-Agent "Mozilla/5.0 (compatible; DendraiBot/1.0)";
        proxy_set_header   Accept "application/json";
        proxy_read_timeout 30s;
    }

    # Proxy SEC www API (mirrors Vite dev proxy)
    location /api/sec/ {
        proxy_pass         https://www.sec.gov/;
        proxy_ssl_server_name on;
        proxy_set_header   Host   www.sec.gov;
        proxy_set_header   User-Agent "Mozilla/5.0 (compatible; DendraiBot/1.0)";
        proxy_set_header   Accept "application/json";
        proxy_read_timeout 30s;
    }

    # RSS proxy — server-side fetch of external RSS feeds (bypasses browser CORS).
    # The JS client calls /api/rss-proxy?url=<encoded> which nginx routes here.
    location /api/rss-proxy {
        proxy_pass         http://127.0.0.1:8001/rss-proxy;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 15s;
    }

    # API server health — proxied so Railway healthcheck can verify uvicorn is up.
    location /health {
        proxy_pass         http://127.0.0.1:8001/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 5s;
    }

    # Auth endpoints — called directly (no /api/mcp/ prefix) by auth.jsx
    location /auth/ {
        proxy_pass         http://127.0.0.1:8001/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Approval workflow endpoints — called directly (no /api/mcp/ prefix),
    # session-cookie authenticated like /auth/ above.
    location /approvals/ {
        proxy_pass         http://127.0.0.1:8001/approvals/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # GitHub webhook — called directly by GitHub (no /api/ prefix, HMAC-signed
    # instead of session-cookie authenticated). Without this block requests
    # fell through to the SPA catch-all below and never reached uvicorn.
    location /github/ {
        proxy_pass         http://127.0.0.1:8001/github/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Evidence webhook — called directly by CI/SAST tooling (no /api/ prefix,
    # per-system Bearer key authenticated instead of session-cookie). Same
    # reasoning as /github/ above: without this block, requests fall through
    # to the SPA catch-all and never reach uvicorn.
    location /evidence/ {
        proxy_pass         http://127.0.0.1:8001/evidence/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ITSM ticket-status webhook — called directly by Jira Automation /
    # ServiceNow Business Rules (no /api/ prefix, per-system Bearer key
    # authenticated instead of session-cookie). Same reasoning as /evidence/
    # above: without this block, requests fall through to the SPA catch-all
    # and never reach uvicorn.
    location /itsm/ {
        proxy_pass         http://127.0.0.1:8001/itsm/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Catch-all for remaining /api/ routes → uvicorn (strips /api/ prefix).
    # Nginx longest-prefix matching means /api/edgar/, /api/sec/, /api/mcp/
    # above always win; this handles /api/pac/, /api/config/, /api/risks-as-code/,
    # /api/risk-register/, /api/controls, /api/scm-audit/, etc.
    location /api/ {
        proxy_pass         http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        '';
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
        proxy_cache        off;
    }

    # SPA fallback for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
