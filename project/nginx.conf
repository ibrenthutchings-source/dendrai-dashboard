server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # MCP Streamable-HTTP — direct path for claude.ai integrations.
    # proxy_buffering off is essential: MCP uses SSE and nginx would otherwise
    # buffer events until the connection closes, breaking the protocol.
    location /mcp/ {
        proxy_pass         http://127.0.0.1:8001/mcp/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        '';
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    }

    # Proxy Python MCP API server (agentic-tools/api_server.py on port 8001)
    location /api/mcp/ {
        proxy_pass         http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        '';
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    }

    # Proxy SEC EDGAR data API (mirrors Vite dev proxy)
    location /api/edgar/ {
        proxy_pass         https://data.sec.gov/;
        proxy_ssl_server_name on;
        proxy_set_header   Host   data.sec.gov;
        proxy_set_header   User-Agent "Mozilla/5.0 (compatible; DendraiBot/1.0)";
        proxy_set_header   Accept "application/json";
        proxy_read_timeout 30s;
    }

    # Proxy SEC www API (mirrors Vite dev proxy)
    location /api/sec/ {
        proxy_pass         https://www.sec.gov/;
        proxy_ssl_server_name on;
        proxy_set_header   Host   www.sec.gov;
        proxy_set_header   User-Agent "Mozilla/5.0 (compatible; DendraiBot/1.0)";
        proxy_set_header   Accept "application/json";
        proxy_read_timeout 30s;
    }

    # SPA fallback for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
