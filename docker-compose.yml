services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dendrai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dendrai_dev}
      POSTGRES_DB: dendrai
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  dendrai-app:
    build:
      context: ./dendrai-app
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL:-postgresql://dendrai:dendrai_dev@postgres:5432/dendrai}
    depends_on:
      - postgres
    restart: unless-stopped

  project:
    build:
      context: ./project
      dockerfile: Dockerfile
    ports:
      - '4173:80'
    restart: unless-stopped

volumes:
  postgres_data:
