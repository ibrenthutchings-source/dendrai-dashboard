services:
  dendrai-app:
    build:
      context: ./dendrai-app
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    restart: unless-stopped

  project:
    build:
      context: ./project
      dockerfile: Dockerfile
    ports:
      - '4173:80'
    restart: unless-stopped
